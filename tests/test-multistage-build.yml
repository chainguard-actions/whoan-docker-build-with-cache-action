name: Test multi-stage build (no push)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          image_name: testns/test-multistage-image
          image_tag: latest
          context: tests/fixtures/multistage
          dockerfile: Dockerfile
          push_image_and_stages: false
          pull_image_and_stages: false

      - name: Assert FULL_IMAGE_NAME output is set
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual FULL_IMAGE_NAME: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: FULL_IMAGE_NAME output is empty"
            exit 1
          fi
          echo "PASS: FULL_IMAGE_NAME is set to '$ACTUAL'"

      - name: Assert multi-stage Docker image was built locally
        run: |
          echo "Listing docker images..."
          docker images
          if ! docker images | grep -q "test-multistage-image"; then
            echo "FAIL: expected docker image 'test-multistage-image' to exist locally"
            exit 1
          fi
          echo "PASS: docker image 'test-multistage-image' exists locally"
