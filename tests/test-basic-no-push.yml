name: Test basic build without push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          image_name: test-image
          context: tests/fixtures/basic
          push_image_and_stages: false
          pull_image_and_stages: false

      - name: Assert FULL_IMAGE_NAME output is set
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected FULL_IMAGE_NAME to be non-empty"
            exit 1
          fi
          echo "PASS: FULL_IMAGE_NAME=$ACTUAL"

      - name: Assert FULL_IMAGE_NAME contains image name
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual: $ACTUAL"
          if [[ "$ACTUAL" != *"test-image"* ]]; then
            echo "FAIL: expected FULL_IMAGE_NAME to contain 'test-image', got: $ACTUAL"
            exit 1
          fi
          echo "PASS"
