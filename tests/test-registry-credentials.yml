name: Test registry credentials inputs (username, password, registry, session)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          image_name: testns/test-registry-creds-image
          registry: myregistry.example.com
          username: testuser
          password: testpassword
          session: fake-session-token
          context: tests/fixtures/simple
          push_image_and_stages: false
          pull_image_and_stages: false

      - name: Assert FULL_IMAGE_NAME output is set
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: FULL_IMAGE_NAME output is empty"
            exit 1
          fi
          echo "PASS: FULL_IMAGE_NAME=$ACTUAL"

      - name: Assert FULL_IMAGE_NAME contains registry
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual: $ACTUAL"
          if [[ "$ACTUAL" != *"myregistry.example.com"* ]]; then
            echo "FAIL: expected FULL_IMAGE_NAME to contain registry 'myregistry.example.com', got: $ACTUAL"
            exit 1
          fi
          echo "PASS: registry present in FULL_IMAGE_NAME"

      - name: Assert Docker image was built
        run: |
          if ! docker images | grep -q "test-registry-creds-image"; then
            echo "FAIL: Docker image 'test-registry-creds-image' not found"
            docker images
            exit 1
          fi
          echo "PASS: Docker image found"
