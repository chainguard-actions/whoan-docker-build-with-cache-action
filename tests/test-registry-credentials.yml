name: Test registry credentials inputs (username, password, registry, session)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          image_name: myorg/test-credentials-image
          username: testuser
          password: testpassword
          registry: ghcr.io
          session: fake-session-token
          context: tests/fixtures/simple
          dockerfile: Dockerfile
          push_image_and_stages: false
          pull_image_and_stages: false

      - name: Assert FULL_IMAGE_NAME output is set
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual FULL_IMAGE_NAME: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: FULL_IMAGE_NAME output is empty"
            exit 1
          fi
          echo "PASS: FULL_IMAGE_NAME is set to '$ACTUAL'"

      - name: Assert FULL_IMAGE_NAME contains registry
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual FULL_IMAGE_NAME: $ACTUAL"
          if [[ "$ACTUAL" != *"ghcr.io"* ]]; then
            echo "FAIL: expected FULL_IMAGE_NAME to contain 'ghcr.io', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: FULL_IMAGE_NAME contains registry 'ghcr.io'"

      - name: Assert Docker image was built locally
        run: |
          echo "Listing docker images..."
          docker images
          if ! docker images | grep -q "test-credentials-image"; then
            echo "FAIL: expected docker image 'test-credentials-image' to exist locally"
            exit 1
          fi
          echo "PASS: docker image 'test-credentials-image' exists locally"
