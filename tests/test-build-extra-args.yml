name: Test build with extra build args
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test Docker context with ARG
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-args-context"
          printf 'FROM alpine:3.18\nARG MY_ARG=default\nRUN echo "ARG value: $MY_ARG"\n' \
            > "$GITHUB_WORKSPACE/test-args-context/Dockerfile"

      - id: action
        uses: .
        with:
          image_name: test-args-image
          context: ${{ github.workspace }}/test-args-context
          dockerfile: Dockerfile
          push_image_and_stages: "false"
          pull_image_and_stages: "false"
          build_extra_args: "--build-arg MY_ARG=hello-world"

      - name: Assert FULL_IMAGE_NAME output is set
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: FULL_IMAGE_NAME output is empty"
            exit 1
          fi
          echo "PASS: FULL_IMAGE_NAME=$ACTUAL"

      - name: Assert Docker image was built
        run: |
          if ! docker image inspect test-args-image:latest > /dev/null 2>&1; then
            echo "FAIL: Docker image 'test-args-image:latest' was not found locally"
            exit 1
          fi
          echo "PASS: Docker image with build args exists"
