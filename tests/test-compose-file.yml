name: Test compose_file input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          compose_file: tests/fixtures/compose/docker-compose.yml
          username: testuser
          context: tests/fixtures
          push_image_and_stages: false
          pull_image_and_stages: false

      - name: Assert Docker image from compose was built
        run: |
          echo "Listing docker images..."
          docker images
          if ! docker images | grep -q "compose-test-image"; then
            echo "FAIL: expected docker image 'compose-test-image' to exist locally"
            exit 1
          fi
          echo "PASS: docker image 'compose-test-image' exists locally"
