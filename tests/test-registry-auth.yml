name: Test Docker build with registry, username, password, session, and stages_image_name inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          image_name: test/registry-auth-image
          context: ${{ github.workspace }}/tests/fixtures/simple-app
          registry: ghcr.io
          username: testuser
          password: testpassword
          session: testsession
          stages_image_name: test/registry-auth-image-stages
          push_image_and_stages: "false"
          pull_image_and_stages: "false"
          build_extra_args: "--no-cache"
        env:
          DOCKER_BUILDKIT: "0"

      - name: Assert FULL_IMAGE_NAME output is set
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: FULL_IMAGE_NAME output is empty"
            exit 1
          fi
          echo "PASS: FULL_IMAGE_NAME=$ACTUAL"

      - name: Assert FULL_IMAGE_NAME contains registry
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual: $ACTUAL"
          if [[ "$ACTUAL" != *"ghcr.io"* ]]; then
            echo "FAIL: expected FULL_IMAGE_NAME to contain 'ghcr.io', got: $ACTUAL"
            exit 1
          fi
          echo "PASS: registry prefix present in FULL_IMAGE_NAME"

      - name: Assert Docker image was built
        run: |
          if ! docker image inspect ghcr.io/test/registry-auth-image:latest > /dev/null 2>&1; then
            echo "FAIL: Docker image ghcr.io/test/registry-auth-image:latest was not built"
            exit 1
          fi
          echo "PASS: Docker image exists"
