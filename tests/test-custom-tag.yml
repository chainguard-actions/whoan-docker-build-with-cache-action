name: Test docker build with custom image tag
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-pull base image for faster build
        run: docker pull alpine:3.18 || true

      - name: Create test Dockerfile in workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-custom-tag-context"
          printf 'FROM alpine:3.18\nRUN echo "hello from custom tag image"\n' \
            > "$GITHUB_WORKSPACE/test-custom-tag-context/Dockerfile"

      - id: action
        uses: .
        env:
          DOCKER_BUILDKIT: "0"
        with:
          image_name: testuser/my-custom-image
          context: ${{ github.workspace }}/test-custom-tag-context
          dockerfile: Dockerfile
          image_tag: v1.0.0
          push_image_and_stages: "false"
          pull_image_and_stages: "false"

      - name: Assert FULL_IMAGE_NAME output is set
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: FULL_IMAGE_NAME output is empty"
            exit 1
          fi
          echo "PASS: FULL_IMAGE_NAME=$ACTUAL"

      - name: Assert FULL_IMAGE_NAME contains image name
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual: $ACTUAL"
          if [[ "$ACTUAL" != *"my-custom-image"* ]]; then
            echo "FAIL: expected FULL_IMAGE_NAME to contain 'my-custom-image', got: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert Docker image was built with custom tag
        run: |
          if ! docker images | grep -q "my-custom-image"; then
            echo "FAIL: Docker image 'my-custom-image' not found in local images"
            docker images
            exit 1
          fi
          if ! docker images | grep "my-custom-image" | grep -q "v1.0.0"; then
            echo "FAIL: Docker image 'my-custom-image:v1.0.0' not found"
            docker images | grep "my-custom-image" || true
            exit 1
          fi
          echo "PASS: Docker image with custom tag found"
