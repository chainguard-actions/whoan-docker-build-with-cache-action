name: Test build with custom image tag
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test Docker context
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-custom-tag-context"
          printf 'FROM alpine:3.18\nRUN echo "hello from custom tag build"\n' \
            > "$GITHUB_WORKSPACE/test-custom-tag-context/Dockerfile"

      - id: action
        uses: .
        with:
          image_name: my-custom-image
          image_tag: v1.2.3
          context: ${{ github.workspace }}/test-custom-tag-context
          dockerfile: Dockerfile
          push_image_and_stages: "false"
          pull_image_and_stages: "false"

      - name: Assert FULL_IMAGE_NAME output is set
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: FULL_IMAGE_NAME output is empty"
            exit 1
          fi
          echo "PASS: FULL_IMAGE_NAME=$ACTUAL"

      - name: Assert FULL_IMAGE_NAME contains image name
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual: $ACTUAL"
          if [[ "$ACTUAL" != *"my-custom-image"* ]]; then
            echo "FAIL: expected FULL_IMAGE_NAME to contain 'my-custom-image', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert Docker image was built with custom tag
        run: |
          if ! docker image inspect my-custom-image:v1.2.3 > /dev/null 2>&1; then
            echo "FAIL: Docker image 'my-custom-image:v1.2.3' was not found locally"
            exit 1
          fi
          echo "PASS: Docker image with custom tag exists"
