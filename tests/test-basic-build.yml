name: Test basic build (no push)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test Docker context
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-basic-context"
          printf 'FROM alpine:3.18\nRUN echo "hello from test build"\n' \
            > "$GITHUB_WORKSPACE/test-basic-context/Dockerfile"

      - id: action
        uses: .
        with:
          image_name: test-basic-image
          context: ${{ github.workspace }}/test-basic-context
          dockerfile: Dockerfile
          push_image_and_stages: "false"
          pull_image_and_stages: "false"

      - name: Assert FULL_IMAGE_NAME output is set
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: FULL_IMAGE_NAME output is empty"
            exit 1
          fi
          echo "PASS: FULL_IMAGE_NAME=$ACTUAL"

      - name: Assert FULL_IMAGE_NAME contains image name
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual: $ACTUAL"
          if [[ "$ACTUAL" != *"test-basic-image"* ]]; then
            echo "FAIL: expected FULL_IMAGE_NAME to contain 'test-basic-image', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert Docker image was built
        run: |
          if ! docker image inspect test-basic-image:latest > /dev/null 2>&1; then
            echo "FAIL: Docker image 'test-basic-image:latest' was not found locally"
            exit 1
          fi
          echo "PASS: Docker image exists"
