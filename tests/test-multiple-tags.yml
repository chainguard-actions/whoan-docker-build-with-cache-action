name: Test multiple image tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          image_name: testns/test-multi-tag-image
          image_tag: latest,v2.0.0,stable
          context: tests/fixtures/simple
          push_image_and_stages: false
          pull_image_and_stages: false

      - name: Assert FULL_IMAGE_NAME output is set
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: FULL_IMAGE_NAME output is empty"
            exit 1
          fi
          echo "PASS: FULL_IMAGE_NAME=$ACTUAL"

      - name: Assert Docker image was built with multiple tags
        run: |
          echo "Docker images:"
          docker images | grep "test-multi-tag-image" || true

          if ! docker images | grep "test-multi-tag-image" | grep -q "latest"; then
            echo "FAIL: Docker image 'test-multi-tag-image:latest' not found"
            exit 1
          fi
          if ! docker images | grep "test-multi-tag-image" | grep -q "v2.0.0"; then
            echo "FAIL: Docker image 'test-multi-tag-image:v2.0.0' not found"
            exit 1
          fi
          if ! docker images | grep "test-multi-tag-image" | grep -q "stable"; then
            echo "FAIL: Docker image 'test-multi-tag-image:stable' not found"
            exit 1
          fi
          echo "PASS: All three tags found"
