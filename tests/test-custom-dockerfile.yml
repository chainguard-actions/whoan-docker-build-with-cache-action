name: Test custom Dockerfile name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          image_name: testns/test-custom-dockerfile-image
          context: tests/fixtures/custom-dockerfile
          dockerfile: MyDockerfile
          push_image_and_stages: false
          pull_image_and_stages: false

      - name: Assert FULL_IMAGE_NAME output is set
        env:
          ACTUAL: ${{ steps.action.outputs.FULL_IMAGE_NAME }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: FULL_IMAGE_NAME output is empty"
            exit 1
          fi
          echo "PASS: FULL_IMAGE_NAME=$ACTUAL"

      - name: Assert Docker image was built from custom Dockerfile
        run: |
          if ! docker images | grep -q "test-custom-dockerfile-image"; then
            echo "FAIL: Docker image 'test-custom-dockerfile-image' not found"
            docker images
            exit 1
          fi
          echo "PASS: Docker image built from custom Dockerfile"
